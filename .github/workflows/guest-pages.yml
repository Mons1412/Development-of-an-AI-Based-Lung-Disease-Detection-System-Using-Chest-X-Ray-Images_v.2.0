name: Deploy Guest Demo to GitHub Pages

on:
  push:
    branches:
      - feature/guest-demo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Guest Demo site
        run: |
          mkdir -p _site
          cp frontend/guest.html _site/index.html
          cp frontend/guest-demo.css _site/guest-demo.css
          cp frontend/guest-demo.js _site/guest-demo.js
          cp frontend/guest-i18n.js _site/guest-i18n.js
          cp frontend/nttu-logo.png _site/nttu-logo.png
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
